<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log de Errores - AgentHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <style>
        .dropdown-content { display: none; }
        .dropdown-content.show { display: block; }
        .modal { display: none; }
        .modal.show { display: flex; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
    <!-- Navbar Lateral -->
    <nav class="fixed left-0 top-0 h-full w-64 bg-white dark:bg-gray-800 shadow-lg z-50">
        <div class="p-4">
            <h2 class="text-xl font-bold">AgentHub</h2>
        </div>
        <ul class="mt-4">
            <li><a href="index.html" class="block p-4 hover:bg-gray-200 dark:hover:bg-gray-700">Inicio</a></li>
            <li><a href="dashboard.html" class="block p-4 hover:bg-gray-200 dark:hover:bg-gray-700">Dashboard</a></li>
            <li><a href="users.html" class="block p-4 hover:bg-gray-200 dark:hover:bg-gray-700">Gestión de Usuarios</a></li>
            <li><a href="agents.html" class="block p-4 hover:bg-gray-200 dark:hover:bg-gray-700">Gestión de Agentes</a></li>
            <li><a href="skills.html" class="block p-4 hover:bg-gray-200 dark:hover:bg-gray-700">Skills</a></li>
            <li><a href="contracts.html" class="block p-4 hover:bg-gray-200 dark:hover:bg-gray-700">Contrataciones</a></li>
            <li><a href="logs.html" class="block p-4 hover:bg-gray-200 dark:hover:bg-gray-700">Log de Errores</a></li>
        </ul>
    </nav>

    <!-- Header -->
    <header class="fixed top-0 right-0 left-64 bg-white dark:bg-gray-800 shadow p-4 flex justify-between items-center z-40">
        <div></div>
        <div class="flex items-center space-x-4">
            <button id="theme-toggle" class="p-2 rounded bg-gray-200 dark:bg-gray-700">🌙</button>
            <img src="https://via.placeholder.com/40" alt="Logo AgentHub" class="cursor-pointer" onclick="window.location.href='index.html'">
        </div>
    </header>

    <!-- Main Content -->
    <main class="ml-64 mt-16 p-8">
        <h1 class="text-3xl font-bold mb-8">Log de Errores</h1>
        <div id="logs-list" class="space-y-4"></div>
    </main>

    <!-- Modal -->
    <div id="log-modal" class="modal fixed inset-0 bg-black bg-opacity-50 justify-center items-center z-50">
        <div class="bg-white dark:bg-gray-800 p-8 rounded shadow max-w-md w-full mx-4">
            <h2 class="text-xl font-bold mb-4">Detalle del Error</h2>
            <div id="log-details"></div>
            <button class="mt-4 bg-red-500 text-white p-2 rounded" onclick="closeModal()">Cerrar</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const logs = [
            { timestamp: '2024-05-01 10:00', agente: 'Agente Asistente', tipo: 'Error de Conexión', descripcion: 'Fallo en la conexión a la base de datos', codigo: 'ERR001' },
            { timestamp: '2024-05-02 11:00', agente: 'Agente Diseñador', tipo: 'Error de Procesamiento', descripcion: 'Error al procesar imagen', codigo: 'ERR002' },
            { timestamp: '2024-05-03 12:00', agente: 'Agente Soporte', tipo: 'Error de Autenticación', descripcion: 'Credenciales inválidas', codigo: 'ERR003' },
            { timestamp: '2024-05-04 13:00', agente: 'Agente Analista', tipo: 'Error de Memoria', descripcion: 'Memoria insuficiente', codigo: 'ERR004' },
            { timestamp: '2024-05-05 14:00', agente: 'Agente Asistente', tipo: 'Error de Red', descripcion: 'Timeout en solicitud', codigo: 'ERR005' },
            { timestamp: '2024-05-06 15:00', agente: 'Agente Diseñador', tipo: 'Error de Configuración', descripcion: 'Configuración incorrecta', codigo: 'ERR006' }
        ];

        function loadLogs() {
            const container = document.getElementById('logs-list');
            logs.forEach(log => {
                const div = document.createElement('div');
                div.className = 'bg-white dark:bg-gray-800 p-4 rounded shadow flex justify-between items-center';
                div.innerHTML = `
                    <div>
                        <p><strong>${log.timestamp}</strong> - ${log.agente}</p>
                        <span class="inline-block px-2 py-1 text-xs font-semibold rounded ${getColor(log.tipo)}">${log.tipo}</span>
                        <p>${log.descripcion}</p>
                        <p>Código: ${log.codigo}</p>
                    </div>
                    <div class="relative">
                        <button class="dropdown-btn">...</button>
                        <div class="dropdown-content absolute right-0 bg-white dark:bg-gray-700 shadow rounded">
                            <button onclick="viewLog('${log.timestamp}', '${log.agente}', '${log.tipo}', '${log.descripcion}', '${log.codigo}')">Ver detalle</button>
                            <button onclick="resolveLog('${log.codigo}')">Marcar como resuelto</button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function getColor(tipo) {
            if (tipo.includes('Conexión')) return 'bg-red-100 text-red-800';
            if (tipo.includes('Procesamiento')) return 'bg-yellow-100 text-yellow-800';
            if (tipo.includes('Autenticación')) return 'bg-blue-100 text-blue-800';
            if (tipo.includes('Memoria')) return 'bg-purple-100 text-purple-800';
            if (tipo.includes('Red')) return 'bg-green-100 text-green-800';
            return 'bg-gray-100 text-gray-800';
        }

        function viewLog(timestamp, agente, tipo, desc, codigo) {
            document.getElementById('log-details').innerHTML = `
                <p><strong>Timestamp:</strong> ${timestamp}</p>
                <p><strong>Agente:</strong> ${agente}</p>
                <p><strong>Tipo:</strong> ${tipo}</p>
                <p><strong>Descripción:</strong> ${desc}</p>
                <p><strong>Código:</strong> ${codigo}</p>
            `;
            document.getElementById('log-modal').classList.add('show');
        }

        function resolveLog(codigo) {
            alert(`Marcar como resuelto: ${codigo}`);
        }

        function closeModal() {
            document.getElementById('log-modal').classList.remove('show');
        }

        loadLogs();
    </script>
</body>
</html>
