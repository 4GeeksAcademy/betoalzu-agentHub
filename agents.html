<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Agentes - AgentHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <style>
        .dropdown-content { display: none; }
        .dropdown-content.show { display: block; }
        .modal { display: none; }
        .modal.show { display: flex; }
        .skills { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .skills.expanded { max-height: 200px; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
    <!-- Navbar Lateral -->
    <nav class="fixed left-0 top-0 h-full w-64 bg-white dark:bg-gray-800 shadow-lg z-50">
        <div class="p-4">
            <h2 class="text-xl font-bold">AgentHub</h2>
        </div>
        <ul class="mt-4">
            <li><a href="index.html" class="block p-4 hover:bg-gray-200 dark:hover:bg-gray-700">Inicio</a></li>
            <li><a href="dashboard.html" class="block p-4 hover:bg-gray-200 dark:hover:bg-gray-700">Dashboard</a></li>
            <li><a href="users.html" class="block p-4 hover:bg-gray-200 dark:hover:bg-gray-700">Gestión de Usuarios</a></li>
            <li><a href="agents.html" class="block p-4 hover:bg-gray-200 dark:hover:bg-gray-700">Gestión de Agentes</a></li>
            <li><a href="skills.html" class="block p-4 hover:bg-gray-200 dark:hover:bg-gray-700">Skills</a></li>
            <li><a href="contracts.html" class="block p-4 hover:bg-gray-200 dark:hover:bg-gray-700">Contrataciones</a></li>
            <li><a href="logs.html" class="block p-4 hover:bg-gray-200 dark:hover:bg-gray-700">Log de Errores</a></li>
        </ul>
    </nav>

    <!-- Header -->
    <header class="fixed top-0 right-0 left-64 bg-white dark:bg-gray-800 shadow p-4 flex justify-between items-center z-40">
        <div></div>
        <div class="flex items-center space-x-4">
            <button id="theme-toggle" class="p-2 rounded bg-gray-200 dark:bg-gray-700">🌙</button>
            <img src="https://via.placeholder.com/40" alt="Logo AgentHub" class="cursor-pointer" onclick="window.location.href='index.html'">
        </div>
    </header>

    <!-- Main Content -->
    <main class="ml-64 mt-16 p-8">
        <h1 class="text-3xl font-bold mb-8">Gestión de Agentes</h1>
        <div id="agents-list" class="space-y-4"></div>
    </main>

    <!-- Modal -->
    <div id="agent-modal" class="modal fixed inset-0 bg-black bg-opacity-50 justify-center items-center z-50">
        <div class="bg-white dark:bg-gray-800 p-8 rounded shadow max-w-md w-full mx-4">
            <h2 class="text-xl font-bold mb-4">Configurar Agente</h2>
            <textarea id="agent-prompt" class="w-full p-2 border rounded" rows="10"></textarea>
            <button class="mt-4 bg-blue-500 text-white p-2 rounded mr-2" onclick="savePrompt()">Guardar</button>
            <button class="mt-4 bg-red-500 text-white p-2 rounded" onclick="closeModal()">Cerrar</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        async function loadAgents() {
            const agents = await fetch('agents.json').then(r => r.json());
            const container = document.getElementById('agents-list');
            agents.forEach(agent => {
                const div = document.createElement('div');
                div.className = 'bg-white dark:bg-gray-800 p-4 rounded shadow';
                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="text-lg font-semibold">${agent.nombre}</h3>
                            <p>Propietario: ${agent.propietario}</p>
                            <p>Estado: ${agent['badge de estado']}</p>
                            <button onclick="toggleSkills(this)" class="text-blue-500">Ver Skills</button>
                            <div class="skills mt-2">
                                <ul>${agent.skills.map(s => `<li>${s}</li>`).join('')}</ul>
                            </div>
                        </div>
                        <div class="relative">
                            <button class="dropdown-btn">...</button>
                            <div class="dropdown-content absolute right-0 bg-white dark:bg-gray-700 shadow rounded">
                                <button onclick="configureAgent('${agent.nombre}')">Configurar</button>
                                <button onclick="deleteAgent('${agent.nombre}')">Eliminar</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function toggleSkills(btn) {
            const skills = btn.nextElementSibling;
            skills.classList.toggle('expanded');
        }

        function configureAgent(nombre) {
            document.getElementById('agent-prompt').value = `Prompt para ${nombre}`;
            document.getElementById('agent-modal').classList.add('show');
        }

        function deleteAgent(nombre) {
            alert(`Eliminar agente: ${nombre}`);
        }

        function savePrompt() {
            alert('Prompt guardado');
            closeModal();
        }

        function closeModal() {
            document.getElementById('agent-modal').classList.remove('show');
        }

        loadAgents();
    </script>
</body>
</html>
